[project]
name = "personal-expense-tracker-backend"
version = "0.1.0"
description = "Backend for the personal expense tracker"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg2-binary>=2.9.9,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
