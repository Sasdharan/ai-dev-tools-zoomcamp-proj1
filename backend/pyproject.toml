[project]
name = "personal-expense-tracker-backend"
version = "0.1.0"
description = "Backend for the personal expense tracker"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.31,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.31,<2",
    "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
    "opentelemetry-instrumentation-logging>=0.52b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.52b0,<1",
    "opentelemetry-sdk>=1.31,<2",
    "psycopg2-binary>=2.9.9,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["database", "main", "models", "settings", "telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["smoke: fast sanity checks for formatting/lint-only changes"]
