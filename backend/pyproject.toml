[project]
name = "personal-expense-tracker-backend"
version = "0.1.0"
description = "Backend for the personal expense tracker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]