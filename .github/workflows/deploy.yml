name: Deploy

# CD: after CI passes on main, publish images tagged with the commit SHA,
# deploy them to dev automatically, then to prod after manual approval
# (GitHub Environment "production" with required reviewers).
# Rollback: run this workflow manually with an earlier commit SHA.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA of previously published images to deploy (rollback); empty builds the current commit
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sasdharan/ai-dev-tools-zoomcamp-proj1

jobs:
  publish:
    name: Publish images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          tag="${INPUT_TAG:-${RUN_SHA:-$GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character commit SHA."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/checkout@v7.0.1
        if: inputs.image_tag == ''
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: docker/login-action@v4.7.0
        if: inputs.image_tag == ''
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        if: inputs.image_tag == ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for service in backend frontend; do
            image="$IMAGE_PREFIX-$service"
            docker build -f "$service/Dockerfile" -t "$image:$TAG" -t "$image:latest" .
            docker push "$image:$TAG"
            docker push "$image:latest"
          done

  deploy-dev:
    name: Deploy to dev
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_WEB_URL }}
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.DEV_WEB_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate configuration, trigger Render deploys and check health
        run: bash .github/scripts/deploy-render.sh

  deploy-prod:
    name: Deploy to production
    needs: [publish, deploy-dev]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_WEB_URL }}
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.PROD_WEB_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate configuration, trigger Render deploys and check health
        run: bash .github/scripts/deploy-render.sh
