name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "migrations/**"
      - "alembic.ini"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t expense-tracker-${{ matrix.service }}:ci .
